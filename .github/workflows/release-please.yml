name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/sha/branch) to publish"
        required: true
        default: "master"
      dist_tag:
        description: "npm dist-tag (next or latest). Leave blank to infer from package version"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        if: github.event_name == 'push'
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Trusted publishing is bound to this workflow filename, so both the automatic
      # release path and any manual republish path live here.
      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install system deps
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install deps
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        run: npm ci

      - name: Test
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        run: npm test

      - name: Build
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        run: npm run build

      - name: Publish
        if: github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created == 'true'
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          # Allow manual overrides, otherwise infer from the package version itself.
          if [ -n "${{ github.event.inputs.dist_tag }}" ]; then
            DIST_TAG="${{ github.event.inputs.dist_tag }}"
          elif [[ "$VERSION" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          echo "Publishing version $VERSION to dist-tag: $DIST_TAG"
          npm publish --tag "$DIST_TAG"
